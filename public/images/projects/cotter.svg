<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, 'Source Code Pro', 'SFMono-Regular', Menlo, monospace">
  <defs>
    <style>
      .t    { fill:#111; font-size:14px; }
      .tb   { fill:#111; font-size:14px; font-weight:700; }
      .sub  { fill:#8a8a8a; font-size:11px; }
      .meth { fill:#555; font-size:12px; }
      .ok   { fill:#16a34a; font-size:14px; font-weight:700; }
      .div  { stroke:#ececec; stroke-width:1; }
    </style>
  </defs>

  <rect width="800" height="450" fill="#fff"/>

  <!-- title -->
  <text x="40" y="46" class="tb" font-size="19">cotter</text>
  <text x="40" y="65" class="sub" font-size="11">compliance testing for robot policies · pytest for robots</text>

  <!-- report panel -->
  <rect x="40" y="88" width="720" height="322" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/>

  <!-- terminal header -->
  <circle cx="64" cy="112" r="4" fill="#e5e5e5"/>
  <circle cx="80" cy="112" r="4" fill="#e5e5e5"/>
  <circle cx="96" cy="112" r="4" fill="#e5e5e5"/>
  <text x="118" y="117" class="meth" font-size="12.5">$ cotter run --policy policy.zip</text>
  <line class="div" x1="40" y1="132" x2="760" y2="132"/>

  <!-- rows -->
  <!-- performance -->
  <text x="70"  y="175" class="ok">✓</text>
  <text x="100" y="175" class="tb">performance</text>
  <text x="272" y="175" class="sub" font-size="12">does it succeed at the task?</text>
  <text x="730" y="175" class="meth" text-anchor="end">Wald’s SPRT</text>
  <line class="div" x1="70" y1="192" x2="730" y2="192"/>

  <!-- safety -->
  <text x="70"  y="231" class="ok">✓</text>
  <text x="100" y="231" class="tb">safety</text>
  <text x="272" y="231" class="sub" font-size="12">any hard physical-limit breach?</text>
  <text x="730" y="231" class="meth" text-anchor="end">per-timestep checks</text>
  <line class="div" x1="70" y1="248" x2="730" y2="248"/>

  <!-- regression -->
  <text x="70"  y="287" class="ok">✓</text>
  <text x="100" y="287" class="tb">regression</text>
  <text x="272" y="287" class="sub" font-size="12">did the new version break it?</text>
  <text x="730" y="287" class="meth" text-anchor="end">McNemar · Wilcoxon</text>
  <line class="div" x1="70" y1="304" x2="730" y2="304"/>

  <!-- adversarial -->
  <text x="70"  y="343" class="ok">✓</text>
  <text x="100" y="343" class="tb">adversarial</text>
  <text x="272" y="343" class="sub" font-size="12">how bad is the worst case?</text>
  <text x="730" y="343" class="meth" text-anchor="end">PPO adversary · 100% → 0%</text>
  <line class="div" x1="70" y1="360" x2="730" y2="360"/>

  <!-- footer summary -->
  <text x="70" y="391" class="ok">✓ 75 passed</text>
  <text x="196" y="391" class="meth">· CI green · CPU-only, no CUDA in the stack</text>
</svg>
