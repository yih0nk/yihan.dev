<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!--
  Lowercase y in Instrument Serif: the same face and case as the wordmark in
  the nav. An OUTLINE, not text — a favicon is its own document and cannot load
  the site's fonts.

  The stroke is deliberate. Instrument Serif is a display face with very fine
  hairlines, and at 16px the unstroked glyph renders as a faint smudge. 40 units
  thickens it enough to read in a tab; 60 was legible too but blobbed the serifs
  at 64px, and this one file has to serve every size.

  FILL AND STROKE BOTH FLIP. Theming only the fill leaves a light letter with a
  dark outline on dark chrome.

  Ink is from src/styles/tokens.ts; the dark value is pure white rather than the
  token's #e9eaec, chosen deliberately for contrast against dark browser chrome.
-->
<style>
path{fill:#14161a;stroke:#14161a}
@media (prefers-color-scheme:dark){path{fill:#fff;stroke:#fff}}
</style>
