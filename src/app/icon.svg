<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32">
<!--
  The footer dog's head, as a favicon. Cropped from the same source as the
  footer retriever (private/ascii-sources), replacing a serif y whose descender
  ran into the bottom edge and read as chopped.

  Two 32px rasters, one per theme. Dark is not the light one recoloured: with
  light ink, dense would mean bright and the head would read as a photo
  negative, so the dark raster inverts the interior (pale fur bright, shadow
  dim) with a floor, and holds the outline at a mid tone. Same approach as
  FooterDog.
-->
<style>
.dark{display:none}
@media (prefers-color-scheme:dark){.light{display:none}.dark{display:inline}}
</style>
<image class="light" width="32" height="32" href="data:image/png;base64,"/>
<image class="dark" width="32" height="32" href="data:image/png;base64,"/>
</svg>
